plugins { id 'java' }
group = 'com.slayertracker'
version = '1.0.0'
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('1.13.7')
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
test { useJUnitPlatform() }
tasks.register('run', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slayertracker.SlayerTrackerPluginTest'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
